[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-geospatial-transfarmer"
version = "0.1.0"
description = "Multimodal UAV-IoT framework for pest density estimation and crop disease detection"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tahleel","Chaitanya","Pranav","Divyanshu" }]
license = { file = "LICENSE" }
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.1",
    "torchvision>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
